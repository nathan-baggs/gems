name: Build and Release

on:
  workflow_run:
    workflows: ["Post-merge Version Bump"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build MinGW toolchain image
        run: docker build --tag patcher-mingw64 .

      - name: Configure
        run: |
          rm -rf build
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            patcher-mingw64 \
            cmake -B build \
              -DCMAKE_TOOLCHAIN_FILE=mingw_toolchain.cmake \
              -G "Ninja Multi-Config"

      - name: Build release configuration
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            patcher-mingw64 \
            cmake --build build --config Release

      - name: Package game artifacts
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}/build" \
            patcher-mingw64 \
            cpack --config CPackConfig.cmake -C Release

      - name: Read package version
        id: version
        run: |
          version=$(sed -nE 's/^set\(CPACK_PACKAGE_VERSION "([^"]+)"\)$/\1/p' build/CPackConfig.cmake)
          if [ -z "$version" ]; then
            echo "::error::Could not find CPACK_PACKAGE_VERSION in build/CPackConfig.cmake"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/*.zip
